name: Deploy to AWS

# Every push to main: test -> build image -> push to ECR -> migrate -> roll out on ECS.
# Can also be started by hand from the Actions tab (workflow_dispatch), e.g. to redeploy or for
# the very first deploy after creating the stack.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request the short-lived OIDC token AWS trusts
    env:
      STACK_NAME: ${{ vars.STACK_NAME || 'nestwell' }}
    steps:
      - uses: actions/checkout@v5

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Look up the ECR repository
        id: repo
        run: |
          uri=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue" --output text)
          echo "uri=$uri" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The commit SHA is the version: it identifies exactly what is running and makes a
          # rollback a one-liner (see DEPLOY_AWS.md).
          tags: ${{ steps.repo.outputs.uri }}:${{ github.sha }}
          # Public OAuth client ID, baked into the JavaScript at build time (not a secret).
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate the database and roll out
        env:
          IMAGE_URI: ${{ steps.repo.outputs.uri }}:${{ github.sha }}
        run: bash scripts/ecs-deploy.sh
